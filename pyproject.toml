[project]
name = "orbis"
version = "0.1.0"
description = "A training system that knows whether the learner is right."
requires-python = ">=3.11,<3.14"
dependencies = [
    "playwright==1.59.0",
    "pytest-playwright>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbis"]
